<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketplace Saúde</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Marketplace Saúde</h1>
    <p>Encontre e agende com profissionais de saúde perto de você</p>
  </header>

  <section class="busca">
    <input type="text" id="inputEspecialidade" placeholder="Especialidade (ex: psicólogo, dentista)">
    <input type="text" id="inputCidade" placeholder="Cidade">
    <button id="btnBuscar">Buscar</button>
  </section>

  <main id="listaProfissionais">
    <!-- Os cards dos profissionais vão aparecer aqui, gerados pelo JavaScript -->
  </main>

  <script src="script.js"></script>
</body>
</html>
